<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title | default("Untitled") }}</title>

    <meta name=generator content="MakePages {{ version }}">

    <link rel="stylesheet" href="/styles.css">

    {% block head %}
    {% endblock %}
</head>
<body>

<header class="container">

    <div style="height: 130px; width: 100%;">
        <img src="/skyline.jpeg">
    </div>

    <nav>
        <div class="left">
            <a href="/">Homepage</a>
            <a href="/map.html">Map</a>
            <a href="/places/">Places</a>
            <a href="/vue.html">Vue.js</a>
        </div>

        <div class="hide-tablet" style="padding-right: 10px;">
            &#127794; Seattle Time: <span id="current_time"></span>
        </div>

    </nav>
</header>

<main class="container">
    <div style="padding: 0.8rem;">
        {% block content %}
        {% endblock %}
    </div>
</main>

{% include "partials/footer.html" %}

<script src="/assets/global.js"></script>

</body>
</html>
